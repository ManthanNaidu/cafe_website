<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cosmic Cafe - Promotions & Trust</title>

    <link rel="stylesheet" href="cafe.css">
</head>

<body>

    <!-- =====================================================
         SECTION 4 : PROMOTIONS & TRUST
    ====================================================== -->

    <section class="promotions-section" id="promotions">

        <!-- ================= PROMOTIONAL CARDS ================= -->

        <div class="promotion-container">

            <!-- ================= SUBSCRIBE CARD ================= -->

            <div class="promotion-card subscribe-card">

                <div class="promotion-content">

                    <p class="small-label">
                        NEVER RUN OUT OF COFFEE
                    </p>

                    <h2>
                        SUBSCRIBE &amp; SAVE
                    </h2>

                    <p class="promotion-description">
                        Save up to 15% on every order
                        <br>
                        + free shipping.
                    </p>

                    <a href="subscription.html" class="promotion-button">
                        SHOP SUBSCRIPTIONS
                    </a>

                </div>


                <div class="promotion-image subscribe-image">

                    <img
                        src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=900&q=85"
                        alt="Premium coffee subscription"
                    >

                </div>

            </div>


            <!-- ================= DISCOUNT CARD ================= -->

            <div class="promotion-card discount-card">

                <div class="promotion-content">

                    <p class="small-label">
                        LIMITED TIME OFFER
                    </p>

                    <h2>
                        GET 10% OFF
                        <br>
                        YOUR FIRST ORDER
                    </h2>

                    <p class="promotion-description">
                        Use code:
                        <strong>BREW10</strong>
                        at checkout
                    </p>

                    <a href="shop.html" class="promotion-button">
                        SHOP NOW
                    </a>

                </div>


                <div class="promotion-image discount-image">

                    <img
                        src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=900&q=85"
                        alt="Coffee cup with latte art"
                    >

                </div>

            </div>

        </div>


        <!-- ================= TRUST / FEATURED BAR ================= -->

        <div class="featured-section">

            <div class="featured-heading">
                AS FEATURED IN
            </div>


            <div class="featured-brands">

                <a
                    href="https://www.foodandwine.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="brand food-wine"
                >
                    Food&amp;Wine
                </a>


                <a
                    href="https://www.forbes.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="brand"
                >
                    Forbes
                </a>


                <a
                    href="https://www.bonappetit.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="brand bon-appetit"
                >
                    bon appétit
                </a>


                <a
                    href="https://www.menshealth.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="brand mens-health"
                >
                    Men'sHealth
                </a>


                <a
                    href="https://www.delish.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="brand delicious"
                >
                    delicious.
                </a>


                <a
                    href="https://www.inc.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="brand inc"
                >
                    Inc.
                </a>

            </div>

        </div>

    </section>



   

</body>
</html>
